<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thapster Button Interaction Prototype</title>
  <meta name="theme-color" content="#0a0614">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050009;
      font-family: Arial, sans-serif;
    }
    #wrap {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #050009;
      position: relative;
    }
    #stage {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      image-rendering: auto;
    }
    #progressOverlay {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 28px;
      z-index: 999;
      pointer-events: none;
    }
    #progressTrack {
      position: absolute;
      left: 0;
      right: 0;
      top: 4px;
      height: 20px;
      cursor: pointer;
      pointer-events: auto;
    }
    #progressTrack::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 5px;
      height: 3px;
      background: rgba(0,0,0,0.68);
      box-shadow: 0 -1px 0 rgba(255,255,255,0.12), 0 0 5px rgba(255,255,255,0.12);
    }
    #progressFill {
      position: absolute;
      left: 0;
      top: 5px;
      height: 3px;
      width: 0%;
      background: rgba(218,222,224,0.88);
      box-shadow: 0 0 6px rgba(255,255,255,0.45);
    }
    #progressKnob {
      position: absolute;
      top: 1px;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      border-radius: 50%;
      background: rgba(178,180,178,0.98);
      border: 1px solid rgba(45,45,45,0.86);
      box-shadow: 0 0 5px rgba(255,255,255,0.45);
    }
    #progressTime {
      position: absolute;
      top: 13px;
      transform: translateX(-50%);
      color: rgba(238,240,240,0.92);
      font: 700 11px Arial, sans-serif;
      text-shadow: 0 0 3px rgba(0,0,0,0.8);
      white-space: nowrap;
      pointer-events: none;
    }
    .topControls {
      position: absolute;
      right: 8px;
      top: 8px;
      display: flex;
      gap: 5px;
      z-index: 3;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: calc(100% - 16px);
      pointer-events: auto;
      opacity: 1;
      transition: opacity 180ms ease;
    }
    #enjoyControls { top: 36px; }
    #enjoyControls button { color:#d9b8ff; border-color:rgba(168,85,247,0.6); background:rgba(168,85,247,0.18); }
    #difficultyControls {
      top: 64px;
    }
    #featureControls {
      top: 92px;
    }
    .topControls button {
      border: 1px solid rgba(255,255,255,0.24);
      background: rgba(10, 8, 18, 0.72);
      color: rgba(255,255,255,0.72);
      font: 700 clamp(8px, 0.72vw, 11px) Arial, sans-serif;
      padding: clamp(4px, 0.48vw, 7px) clamp(6px, 0.62vw, 9px);
      border-radius: 6px;
      cursor: pointer;
    }
    .topControls {
      opacity: 0.18;
    }
    .topControls:hover,
    .topControls:focus-within {
      opacity: 1;
    }
    .topControls button.active {
      color: #fff;
      border-color: rgba(255,255,255,0.72);
      box-shadow: 0 0 16px rgba(255,255,255,0.18);
    }

    #fs-btn {
      position: fixed;
      bottom: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      touch-action: manipulation;
    }
    #songBtn { position: fixed; right: 54px; bottom: 10px; width: 36px; height: 36px; border-radius: 6px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); color:#fff; font-size:16px; cursor:pointer; z-index:9999; }
    #hudBtn { position: fixed; right: 96px; bottom: 10px; width: 36px; height: 36px; border-radius: 6px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); color:#fff; font-size:16px; cursor:pointer; z-index:9999; }
    body.nohud .topControls, body.nohud #fs-btn, body.nohud #songBtn { display:none !important; }
    body.nohud #progressTrack { pointer-events:none; }
    body.nohud #progressTime, body.nohud #progressKnob { display:none; }
    body.nohud #hudBtn { opacity: 0.12; }
    .ov { position: fixed; inset: 0; background: rgba(0,0,0,0.82); z-index: 10000; display:flex; align-items:center; justify-content:center; }
    .ov.hidden { display:none; }
    .ov .panel { background:#10121a; border:1px solid rgba(255,255,255,0.2); border-radius:10px; padding:18px 20px; min-width:min(92vw,520px); max-height:88vh; overflow:auto; color:#fff; font-family: Arial, sans-serif; }
    .ov h1 { margin:0 0 10px; font-size:22px; letter-spacing:4px; }
    .ov h2 { margin:0 0 12px; font-size:16px; }
    .ov input[type=number] { flex:1; min-width:0; background:#1c2029; border:1px solid #2a2f3d; color:#e8eaf0; padding:8px; border-radius:6px; font-size:14px; }
    .ov .row { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
    .ov button { background:#1e2330; color:#fff; border:1px solid rgba(255,255,255,0.28); border-radius:6px; padding:8px 12px; font-size:13px; cursor:pointer; }
    .ov button:hover { background:#2a3144; }
    .ov button small { display:block; font-size:10px; opacity:.7; }
    .ov button.pre { border-color:#ffd54a; box-shadow:0 0 6px rgba(255,213,74,.5); }
    .songRow { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.1); }
    .songRow .nm { flex:1; font-size:14px; }
    .songRow .dl { opacity:.6; }
    #songList .empty { opacity:.6; font-size:13px; padding:8px 0; }
    #fs-btn:hover { background: rgba(255,255,255,0.15); }

    :fullscreen #wrap,
    :-webkit-full-screen #wrap,
    :-moz-full-screen #wrap {
      width: 100vw;
      height: 100vh;
      background: #050009;
    }
    :fullscreen #stage,
    :-webkit-full-screen #stage,
    :-moz-full-screen #stage {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
    }
    :fullscreen,
    :-webkit-full-screen,
    :-moz-full-screen {
      background: #050009;
    }
    /* timebar: bigger invisible grab area + no browser scroll gesture stealing the drag */
    #progressTrack { touch-action: none; }
    #progressTrack::after { content: ""; position: absolute; left: -6px; right: -6px; top: -8px; height: 44px; }
    #playBtn { position: fixed; right: 138px; bottom: 10px; width: 36px; height: 36px; border-radius: 6px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); color:#fff; font-size:16px; cursor:pointer; z-index:9999; touch-action: manipulation; }
    #assetBtn { position: fixed; right: 180px; bottom: 10px; width: 36px; height: 36px; border-radius: 6px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); color:#fff; font-size:16px; cursor:pointer; z-index:9999; touch-action: manipulation; }
    body.nohud #playBtn, body.nohud #assetBtn { display:none !important; }
    #styleControls { top: 120px; }
    /* the real file inputs sit invisibly on top of the drawn "Load Chart" / "Load Audio" buttons: the tap goes straight to the browser's own file button (no script in between, works in a PWA) */
    .pickOv { position: absolute; z-index: 5; opacity: 0; display: none; margin: 0; padding: 0; cursor: pointer; font-size: 200px; overflow: hidden; }
    #thToast { position: fixed; left: 50%; bottom: 14%; transform: translateX(-50%); z-index: 99999; max-width: 86vw; background: rgba(0,0,0,.85); color: #fff; padding: 10px 16px; border-radius: 10px; font: 13px Arial, sans-serif; white-space: pre-line; display: none; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="stage">
      <canvas id="game" width="640" height="360"></canvas>
      <input type="file" id="json-file-input" class="pickOv" title="Load chart">
      <input type="file" id="audio-file-input" class="pickOv" title="Load audio">
      <div id="progressOverlay" aria-label="Song progress">
        <div id="progressTrack">
          <div id="progressFill"></div>
          <div id="progressKnob"></div>
          <div id="progressTime">0:00</div>
        </div>
      </div>
      <div id="judgmentControls" class="topControls" aria-label="Judgment mode" data-panel-label="J">
        <button data-judge="0" class="active" title="Perfect">P</button>
        <button data-judge="1" title="Great">G</button>
        <button data-judge="2" title="Cool">C</button>
        <button data-judge="3" title="Bad">B</button>
        <button data-judge="4" title="Miss">M</button>
      </div>
      <div id="enjoyControls" class="topControls" aria-label="Enjoy" data-panel-label="E"><button id="enjoyBtn" title="Enjoy: fullscreen, hide the buttons, start the song from the beginning">🎮 ENJOY</button></div>
      <div id="difficultyControls" class="topControls" aria-label="Difficulty" data-panel-label="D">
        <button data-difficulty="easy" title="Easy: 3 lanes">EASY</button>
        <button data-difficulty="normal" class="active" title="Normal: 4 lanes">NORMAL</button>
        <button data-difficulty="expert" title="Expert: 5 lanes">EXPERT</button>
      </div>
      <div id="styleControls" class="topControls" aria-label="Lane light" data-panel-label="S">
        <button data-lightmode="floating" class="active" title="Lane light when a button is pressed: floating strength">LIGHT F</button>
        <button data-lightmode="bright" title="Lane light when a button is pressed: the brighter test strength">LIGHT T</button>
      </div>
      <div id="featureControls" class="topControls" aria-label="Feature toggles" data-panel-label="U">
        <button data-feature="settingsOverlay" class="active" title="Show settings overlay">SET</button>
        <button data-feature="debugNoteIds" title="Show debug note IDs">IDS</button>
        <button data-feature="autoPlay" title="Autoplay (off = play yourself)">AUTO</button>
      </div>
    </div>
  </div>

  <button id="fs-btn" title="Fullscreen">⛶</button>
  <button id="songBtn" title="Songs">♪</button>
  <button id="hudBtn" title="Hide / show every button (play view only)">👁</button>
  <button id="playBtn" title="Play / stop the song from where the timebar is">▶</button>
  <button id="assetBtn" title="Load skin PNG files (select many at once)">🖼</button>
  <input type="file" id="asset-file-input" accept=".png,image/png" multiple style="display:none">
  <div id="thToast"></div>
  <div id="timeScreen" class="ov hidden"><div class="panel">
    <h2>🎯 ตั้งเวลา (แบบ floating)</h2>
    <div style="font-size:12px;opacity:.75">โน้ตแรก "โดน" (ตรงเส้น) ที่วินาทีไหน — ไม่ใช่ตอน spawn — ทุกโน้ตจะเลื่อนตามส่วนต่างเท่ากัน</div>
    <div class="row"><input id="tFirst" type="number" step="0.001" placeholder="0.000"><button id="tFirstCur" title="ใช้เวลาปัจจุบันของเพลง">⏱</button><button id="tFirstApply">Apply</button></div>
    <div style="font-size:12px;opacity:.75;margin-top:14px">เพลงเริ่มที่ — วางต้นไฟล์เสียงที่วินาทีนี้ของชาร์ต (ว่าง = 0, ติดลบได้)</div>
    <div class="row"><input id="tStart" type="number" step="0.001" placeholder="0.000"><button id="tStartCur" title="ใช้เวลาปัจจุบันของเพลง">⏱</button><button id="tStartApply">Apply</button></div>
    <div id="tStatus" style="font-size:12px;opacity:.7;margin-top:12px">—</div>
    <div class="row"><button id="tClose">ปิด</button></div>
  </div></div>

    ptrHost.addEventListener("pointercancel", pointerEnd);
    judgmentButtons.forEach(button => {
      button.addEventListener("click", () => {
        setJudgmentMode(Number(button.dataset.judge));
      });
    });
    difficultyButtons.forEach(button => {
      button.addEventListener("click", () => {
        setDifficulty(button.dataset.difficulty);
      });
    });
    featureButtons.forEach(button => {
      button.addEventListener("click", () => {
        setFeatureToggle(button.dataset.feature);
      });
    });
    progressTrack.addEventListener("pointerdown", e => { e.preventDefault(); seekBegin(e); });
    progressTrack.addEventListener("pointermove", e => { if (seekDrag && e.pointerId === seekDrag.id) seekProgressFromClientX(e.clientX); });
    progressTrack.addEventListener("pointerup", e => { if (progressTrack.hasPointerCapture(e.pointerId)) progressTrack.releasePointerCapture(e.pointerId); seekEnd(e); });
    progressTrack.addEventListener("pointercancel", seekEnd);
    progressTrack.addEventListener("lostpointercapture", seekEnd);
    document.getElementById("playBtn").addEventListener("click", togglePlay);
    document.getElementById("assetBtn").addEventListener("click", () => document.getElementById("asset-file-input").click());
    document.getElementById("asset-file-input").addEventListener("change", async e => {
      const files = [...e.target.files].filter(f => /\.png$/i.test(f.name)); e.target.value = "";
      let ok = 0; const unknown = [];
      for (const f of files) {
        const key = assetKeyFor(f.name); if (!key) { unknown.push(f.name); continue; }
        try { noteImages[key] = await imageFromBytes(new Uint8Array(await f.arrayBuffer()), "image/png"); ok++; } catch (err) { unknown.push(f.name); }
      }
      if (noteImages.flick_up) noteImages.flickArrow = noteImages.flick_up;
      if (noteImages.flickMiss_up) noteImages.flickArrowMiss = noteImages.flickMiss_up;
      let m = "โหลดรูปได้ " + ok + " ไฟล์"; if (unknown.length) m += "\nชื่อไฟล์ที่ไม่รู้จัก: " + unknown.slice(0, 5).join(", ");
      thToast(m, unknown.length ? 8000 : 4000);
    });
    (function () {   // light strength buttons (remembered) + stage resize hooks
      const sv = (k, v) => { try { localStorage.setItem("thapster-" + k, v); } catch (e) {} };
      const ld = k => { try { return localStorage.getItem("thapster-" + k); } catch (e) { return null; } };
      const lm = ld("lightMode");
      if (lm === "floating" || lm === "bright") state.lightMode = lm;
      const sync = () => {
        document.querySelectorAll("[data-lightmode]").forEach(b => b.classList.toggle("active", b.dataset.lightmode === state.lightMode));
      };
      document.querySelectorAll("[data-lightmode]").forEach(b => b.addEventListener("click", () => { state.lightMode = b.dataset.lightmode; sv("lightMode", state.lightMode); sync(); }));
      sync();
      window.addEventListener("resize", () => requestAnimationFrame(resizeStage));
      window.addEventListener("orientationchange", () => setTimeout(resizeStage, 200));
      ["fullscreenchange","webkitfullscreenchange"].forEach(ev => document.addEventListener(ev, () => setTimeout(resizeStage, 100)));
      resizeStage();
    })();
    window.addEventListener("resize", updateProgressOverlay);
    updateProgressOverlay();

    rafId = requestAnimationFrame(frame);
  </script>
<script>
// register the service worker only on real hosting (GitHub Pages etc.); skip silently in previews/sandboxes
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/claude\.(ai|com)|claudeusercontent/.test(location.hostname)) {
  window.addEventListener('load', () => {
    try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
  });
}
</script>
